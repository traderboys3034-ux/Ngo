<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | Rosani Asahaya Seva</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f1f5f9;
      color: #172033;
    }

    header {
      background: #123c2d;
      color: white;
      padding: 18px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    header h2 { font-size: 21px; }

    .container {
      width: 94%;
      max-width: 1100px;
      margin: 25px auto;
    }

    .panel {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 4px 18px #0000000c;
      margin-bottom: 20px;
    }

    h3 {
      margin-bottom: 18px;
      color: #123c2d;
    }

    .login-box {
      max-width: 420px;
      margin: 75px auto;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d5dce5;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      margin-top: 7px;
      background: white;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #168653;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-top: 13px;
    }

    textarea {
      min-height: 75px;
      resize: vertical;
    }

    button {
      border: none;
      padding: 11px 17px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .primary {
      background: #168653;
      color: white;
    }

    .secondary {
      background: #e8eef0;
      color: #263238;
    }

    .danger {
      background: #fee2e2;
      color: #b91c1c;
    }

    .top-btn {
      background: white;
      color: #123c2d;
    }

    .full {
      width: 100%;
      margin-top: 18px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      border-radius: 12px;
      padding: 19px;
      box-shadow: 0 3px 12px #00000008;
    }

    .stat p {
      color: #64748b;
      font-size: 13px;
    }

    .stat h2 {
      color: #168653;
      margin-top: 8px;
      font-size: 25px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 15px;
    }

    .form-grid .full-field {
      grid-column: 1 / -1;
    }

    .record {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 16px;
      margin-top: 12px;
      background: #fff;
    }

    .record-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .record h4 {
      color: #123c2d;
      font-size: 17px;
    }

    .record p {
      margin-top: 8px;
      color: #475569;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .record-actions {
      display: flex;
      gap: 8px;
      margin-top: 13px;
    }

    .status {
      display: inline-block;
      border-radius: 20px;
      padding: 5px 10px;
      font-size: 12px;
      background: #dcfce7;
      color: #166534;
    }

    .status.pending {
      background: #fef3c7;
      color: #92400e;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .toolbar input {
      flex: 1;
      min-width: 180px;
      margin: 0;
    }

    .message {
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.5;
      color: #b91c1c;
    }

    .hidden { display: none !important; }

    .empty {
      color: #64748b;
      text-align: center;
      padding: 25px 5px;
    }

    @media(max-width: 650px) {
      .stats { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .form-grid .full-field { grid-column: auto; }
      .panel { padding: 16px; }
    }
  </style>
</head>

<body>

<header>
  <h2>🌿 Rosani Asahaya Seva</h2>
  <button id="logoutBtn" class="top-btn hidden">Logout</button>
</header>

<!-- LOGIN -->
<div id="loginSection" class="container">
  <div class="panel login-box">
    <h3>🔐 Admin Login</h3>

    <form id="loginForm">
      <label>Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Admin email डालें"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="Password डालें"
        required
      >

      <button type="submit" class="primary full" id="loginBtn">
        Login करें
      </button>

      <p id="loginMessage" class="message"></p>
    </form>
  </div>
</div>

<!-- ADMIN DASHBOARD -->
<main id="dashboard" class="container hidden">

  <div class="stats">
    <div class="stat">
      <p>कुल लाभार्थी</p>
      <h2 id="totalRecords">0</h2>
    </div>

    <div class="stat">
      <p>आज के रिकॉर्ड</p>
      <h2 id="todayRecords">0</h2>
    </div>

    <div class="stat">
      <p>कुल सहायता राशि</p>
      <h2 id="totalAmount">₹0</h2>
    </div>
  </div>

  <!-- ADD / EDIT FORM -->
  <section class="panel">
    <h3 id="formHeading">➕ नया रिकॉर्ड जोड़ें</h3>

    <form id="recordForm">
      <input type="hidden" id="editId">

      <div class="form-grid">

        <div>
          <label>लाभार्थी का नाम *</label>
          <input
            type="text"
            id="personName"
            placeholder="पूरा नाम"
            maxlength="80"
            required
          >
        </div>

        <div>
          <label>मोबाइल नंबर (वैकल्पिक)</label>
          <input
            type="tel"
            id="phone"
            placeholder="मोबाइल नंबर"
            maxlength="15"
          >
        </div>

        <div>
          <label>गाँव / पता *</label>
          <input
            type="text"
            id="village"
            placeholder="गाँव का नाम"
            maxlength="120"
            required
          >
        </div>

        <div>
          <label>सहायता का प्रकार *</label>
          <select id="helpType" required>
            <option value="">चुनें</option>
            <option>खाद्य सामग्री</option>
            <option>कपड़े</option>
            <option>शिक्षा सहायता</option>
            <option>चिकित्सा सहायता</option>
            <option>आर्थिक सहायता</option>
            <option>अन्य</option>
          </select>
        </div>

        <div>
          <label>सहायता राशि (₹)</label>
          <input
            type="number"
            id="amount"
            placeholder="जैसे 1000"
            min="0"
            max="10000000"
          >
        </div>

        <div>
          <label>तारीख *</label>
          <input type="date" id="date" required>
        </div>

        <div>
          <label>स्थिति</label>
          <select id="status">
            <option value="पूर्ण">सहायता पूर्ण</option>
            <option value="बाकी">सहायता बाकी</option>
          </select>
        </div>

        <div class="full-field">
          <label>अतिरिक्त जानकारी</label>
          <textarea
            id="details"
            placeholder="सहायता से जुड़ी जानकारी..."
            maxlength="500"
          ></textarea>
        </div>

      </div>

      <button type="submit" class="primary" id="saveBtn">
        रिकॉर्ड सेव करें
      </button>

      <button
        type="button"
        class="secondary hidden"
        id="cancelEditBtn"
      >
        Edit रद्द करें
      </button>

      <p id="formMessage" class="message"></p>
    </form>
  </section>

  <!-- RECORD LIST -->
  <section class="panel">
    <h3>📋 सभी सहायता रिकॉर्ड</h3>

    <div class="toolbar">
      <input
        type="search"
        id="searchInput"
        placeholder="नाम या गाँव से खोजें..."
      >

      <button class="secondary" id="exportBtn">
        CSV डाउनलोड
      </button>
    </div>

    <div id="recordsList">
      <p class="empty">डेटा लोड हो रहा है...</p>
    </div>
  </section>

</main>

<script type="module">
  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

  import {
    getDatabase,
    ref,
    push,
    set,
    update,
    remove,
    onValue
  } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";


  // FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "AIzaSyD8q2-R6s9qLzrh1SSm-MkL-gAXD1EHh6A",
    authDomain: "rosani-asahaya-seva.firebaseapp.com",
    databaseURL: "https://rosani-asahaya-seva-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "rosani-asahaya-seva",
    storageBucket: "rosani-asahaya-seva.firebasestorage.app",
    messagingSenderId: "256587001716",
    appId: "1:256587001716:web:922663300412f781034621",
    measurementId: "G-T01JDQ8370"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const recordsRef = ref(db, "beneficiaries");

  let allRecords = {};
  let stopListening = null;

  const $ = id => document.getElementById(id);

  // आज की तारीख
  function localDate() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
  }

  $("date").value = localDate();

  function showMessage(id, message, success = false) {
    const element = $(id);
    element.textContent = message;
    element.style.color = success ? "#168653" : "#b91c1c";
  }

  // LOGIN
  $("loginForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    $("loginBtn").disabled = true;
    showMessage("loginMessage", "Login हो रहा है...");

    try {
      await signInWithEmailAndPassword(
        auth,
        $("email").value.trim(),
        $("password").value
      );

      $("password").value = "";
      showMessage("loginMessage", "");
    } catch (error) {
      showMessage("loginMessage", "Login नहीं हुआ। Email और Password जाँचें।");
      console.error(error);
    } finally {
      $("loginBtn").disabled = false;
    }
  });

  // AUTH CHECK
  onAuthStateChanged(auth, (user) => {
    if (user) {
      $("loginSection").classList.add("hidden");
      $("dashboard").classList.remove("hidden");
      $("logoutBtn").classList.remove("hidden");

      if (stopListening) stopListening();

      stopListening = onValue(recordsRef, (snapshot) => {
        allRecords = snapshot.val() || {};
        renderRecords();
        updateStats();
      }, (error) => {
        console.error(error);
        $("recordsList").textContent =
          "डेटा लोड नहीं हुआ। Firebase Rules जाँचें।";
      });

    } else {
      if (stopListening) {
        stopListening();
        stopListening = null;
      }

      allRecords = {};
      $("loginSection").classList.remove("hidden");
      $("dashboard").classList.add("hidden");
      $("logoutBtn").classList.add("hidden");
    }
  });

  // LOGOUT
  $("logoutBtn").addEventListener("click", async () => {
    await signOut(auth);
    resetForm();
  });

  // SAVE NEW OR UPDATE RECORD
  $("recordForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    const user = auth.currentUser;
    if (!user) return;

    const editId = $("editId").value;

    const amountValue = $("amount").value.trim();

    const record = {
      name: $("personName").value.trim(),
      phone: $("phone").value.trim(),
      village: $("village").value.trim(),
      helpType: $("helpType").value,
      amount: amountValue === "" ? 0 : Number(amountValue),
      date: $("date").value,
      status: $("status").value,
      details: $("details").value.trim(),
      updatedAt: Date.now()
    };

    if (!record.name || !record.village || !record.helpType || !record.date) {
      showMessage("formMessage", "कृपया जरूरी जानकारी भरें।");
      return;
    }

    $("saveBtn").disabled = true;
    showMessage("formMessage", "सेव हो रहा है...");

    try {
      if (editId) {
        await update(ref(db, "beneficiaries/" + editId), record);
        showMessage("formMessage", "रिकॉर्ड अपडेट हो गया।", true);
      } else {
        record.createdAt = Date.now();
        const newRecord = push(recordsRef);
        await set(newRecord, record);
        showMessage("formMessage", "नया रिकॉर्ड सेव हो गया।", true);
      }

      resetForm();

    } catch (error) {
      console.error(error);
      showMessage(
        "formMessage",
        "रिकॉर्ड सेव नहीं हुआ। इंटरनेट और Firebase Rules जाँचें।"
      );
    } finally {
      $("saveBtn").disabled = false;
    }
  });

  // RESET FORM
  function resetForm() {
    $("recordForm").reset();
    $("editId").value = "";
    $("date").value = localDate();
    $("formHeading").textContent = "➕ नया रिकॉर्ड जोड़ें";
    $("saveBtn").textContent = "रिकॉर्ड सेव करें";
    $("cancelEditBtn").classList.add("hidden");
  }

  $("cancelEditBtn").addEventListener("click", resetForm);

  // EDIT RECORD
  function editRecord(id) {
    const record = allRecords[id];
    if (!record) return;

    $("editId").value = id;
    $("personName").value = record.name || "";
    $("phone").value = record.phone || "";
    $("village").value = record.village || "";
    $("helpType").value = record.helpType || "";
    $("amount").value = record.amount || "";
    $("date").value = record.date || localDate();
    $("status").value = record.status || "पूर्ण";
    $("details").value = record.details || "";

    $("formHeading").textContent = "✏️ रिकॉर्ड Edit करें";
    $("saveBtn").textContent = "अपडेट करें";
    $("cancelEditBtn").classList.remove("hidden");

    $("formHeading").scrollIntoView({ behavior: "smooth" });
  }

  // DELETE RECORD
  async function deleteRecord(id) {
    const record = allRecords[id];
    if (!record) return;

    const confirmDelete = confirm(
      "क्या आप " + record.name + " का रिकॉर्ड Delete करना चाहते हैं?"
    );

    if (!confirmDelete) return;

    try {
      await remove(ref(db, "beneficiaries/" + id));

      if ($("editId").value === id) resetForm();

    } catch (error) {
      console.error(error);
      alert("रिकॉर्ड Delete नहीं हुआ। Firebase Rules जाँचें।");
    }
  }

  // RENDER RECORDS
  function renderRecords() {
    const list = $("recordsList");
    const search = $("searchInput").value.trim().toLowerCase();

    list.replaceChildren();

    const records = Object.entries(allRecords)
      .filter(([id, record]) => {
        const text = [
          record.name,
          record.village,
          record.helpType
        ].join(" ").toLowerCase();

        return text.includes(search);
      })
      .sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));

    if (records.length === 0) {
      const empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "अभी कोई रिकॉर्ड नहीं मिला।";
      list.appendChild(empty);
      return;
    }

    records.forEach(([id, record]) => {
      const card = document.createElement("div");
      card.className = "record";

      const top = document.createElement("div");
      top.className = "record-top";

      const name = document.createElement("h4");
      name.textContent = record.name || "बिना नाम";

      const status = document.createElement("span");
      status.className = "status" +
        (record.status === "बाकी" ? " pending" : "");
      status.textContent = record.status || "पूर्ण";

      top.append(name, status);

      const info = document.createElement("p");
      info.textContent =
        "📍 गाँव: " + (record.village || "-") +
        "\n सहायता: " + (record.helpType || "-") +
        "\n राशि: ₹" + (record.amount || 0) +
        "\n तारीख: " + (record.date || "-") +
        (record.phone ? "\n मोबाइल: " + record.phone : "") +
        (record.details ? "\n जानकारी: " + record.details : "");

      info.style.whiteSpace = "pre-line";

      const actions = document.createElement("div");
      actions.className = "record-actions";

      const editBtn = document.createElement("button");
      editBtn.className = "secondary";
      editBtn.textContent = "Edit";
      editBtn.addEventListener("click", () => editRecord(id));

      const deleteBtn = document.createElement("button");
      deleteBtn.className = "danger";
      deleteBtn.textContent = "Delete";
      deleteBtn.addEventListener("click", () => deleteRecord(id));

      actions.append(editBtn, deleteBtn);
      card.append(top, info, actions);
      list.appendChild(card);
    });
  }

  // DASHBOARD TOTALS
  function updateStats() {
    const records = Object.values(allRecords);
    const today = localDate();

    const todayCount = records.filter(
      record => record.date === today
    ).length;

    const totalAmount = records.reduce(
      (sum, record) => sum + (Number(record.amount) || 0),
      0
    );

    $("totalRecords").textContent = records.length;
    $("todayRecords").textContent = todayCount;
    $("totalAmount").textContent =
      "₹" + totalAmount.toLocaleString("en-IN");
  }

  // SEARCH
  $("searchInput").addEventListener("input", renderRecords);

  // CSV EXPORT
  $("exportBtn").addEventListener("click", () => {
    const records = Object.values(allRecords);

    if (records.length === 0) {
      alert("डाउनलोड करने के लिए कोई रिकॉर्ड नहीं है।");
      return;
    }

    const headers = [
      "नाम", "मोबाइल", "गाँव", "सहायता",
      "राशि", "तारीख", "स्थिति", "जानकारी"
    ];

    const rows = records.map(record => [
      record.name,
      record.phone,
      record.village,
      record.helpType,
      record.amount,
      record.date,
      record.status,
      record.details
    ]);

    const csvCell = value =>
      '"' + String(value ?? "").replace(/"/g, '""') + '"';

    const csv = "\uFEFF" +
      [headers, ...rows]
        .map(row => row.map(csvCell).join(","))
        .join("\n");

    const blob = new Blob([csv], {
      type: "text/csv;charset=utf-8;"
    });

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "rosani-beneficiary-records.csv";
    link.click();

    URL.revokeObjectURL(url);
  });

</script>

</body>
  </html>
