<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Rosani Asahaya Seva</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<style>
:root { --bg: #0C0C14; --card: #18182A; --fg: #EDEDF5; --muted: #9CA3AF; --accent: #F4714A; --success: #22C55E; --warning: #FBBF24; --danger: #F87171; --border: #2D2D45; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans Devanagari', 'Poppins', sans-serif; background: var(--bg); color: var(--fg); padding-bottom: 40px; }
header { background: var(--accent); color: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
.container { max-width: 960px; margin: 20px auto; padding: 0 16px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 20px; }
.login-box { max-width: 380px; margin: 70px auto; }
h2 { font-family: 'Poppins', sans-serif; font-size: 1.05rem; margin-bottom: 14px; color: var(--accent); }
label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--muted); margin: 10px 0 4px; text-transform: uppercase; }
input, select, textarea { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--bg); color: var(--fg); font-size: 0.9rem; }
.btn { padding: 10px 16px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; font-family: 'Poppins', sans-serif; font-size: 0.85rem; }
.btn-primary { background: var(--accent); color: #fff; width: 100%; margin-top: 14px; }
.btn-sm { padding: 5px 10px; font-size: 0.75rem; border-radius: 6px; }
.btn-done { background: rgba(34,197,94,0.15); color: var(--success); border: 1px solid var(--success); }
.btn-edit { background: rgba(96,165,250,0.15); color: #60A5FA; border: 1px solid #60A5FA; }
.btn-del { background: rgba(248,113,113,0.15); color: var(--danger); border: 1px solid var(--danger); }
.tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.tab { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--muted); font-weight: 700; cursor: pointer; }
.tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th, td { padding: 10px 8px; border-bottom: 1px solid var(--border); text-align: left; font-size: 0.85rem; }
th { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; }
.table-wrap { overflow-x: auto; }
[hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <strong>🔐 Admin Control Panel</strong>
  <button class="btn btn-sm" style="background:rgba(0,0,0,0.25);color:#fff;" id="logoutBtn" onclick="logout()" hidden>Logout</button>
</header>

<!-- LOGIN SCREEN -->
<div class="container login-box" id="loginView">
  <div class="card">
    <h2>Admin Login</h2>
    <label>Email</label>
    <input type="email" id="adminEmail" placeholder="admin@example.com">
    <label>Password</label>
    <input type="password" id="adminPass" placeholder="••••••••">
    <button class="btn btn-primary" onclick="login()">Login Karein</button>
    <p id="loginErr" style="color:var(--danger);font-size:0.8rem;margin-top:10px;"></p>
  </div>
</div>

<!-- ADMIN DASHBOARD -->
<div class="container" id="adminView" hidden>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('beneficiaries', this)">👥 Beneficiaries</button>
    <button class="tab" onclick="switchTab('settings', this)">⚙️ Website & Donation Settings</button>
  </div>

  <!-- TAB 1: BENEFICIARIES -->
  <div id="tabBeneficiaries">
    <div class="card">
      <h2 id="formHeading">➕ नया Beneficiary जोड़ें</h2>
      <input type="hidden" id="editId">
      <label>लाभार्थी का नाम *</label>
      <input type="text" id="fNaam" placeholder="नाम लिखें">
      <label>सेवा प्रकार *</label>
      <select id="fSeva">
        <option value="Khana">🍽️ खाना (Khana)</option>
        <option value="Kapde">👕 कपड़े (Kapde)</option>
        <option value="Chikitsa">🏥 चिकित्सा (Chikitsa)</option>
        <option value="Shiksha">📚 शिक्षा (Shiksha)</option>
        <option value="Aarthik">💰 आर्थिक सहायता (Aarthik)</option>
        <option value="Aavas">🏠 आवास (Aavas)</option>
        <option value="Anya">🤝 अन्य (Anya)</option>
      </select>
      <label>तारीख *</label>
      <input type="date" id="fTarikh">
      <label>Status</label>
      <select id="fStatus">
        <option value="pending">⏳ Pending</option>
        <option value="complete">✅ Complete</option>
      </select>
      <label>विवरण / Notes (Optional)</label>
      <input type="text" id="fNotes" placeholder="कोई विशेष जानकारी...">
      <button class="btn btn-primary" onclick="saveBeneficiary()" id="saveBtn">💾 Save Record</button>
      <button class="btn" style="width:100%;margin-top:8px;background:var(--border);color:#fff;" id="cancelEditBtn" onclick="resetForm()" hidden>Cancel Edit</button>
    </div>

    <div class="card">
      <h2>📋 सभी Beneficiaries (Manage)</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Seva</th><th>Date</th><th>Status</th><th>Action</th></tr></thead>
          <tbody id="adminTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- TAB 2: WEBSITE SETTINGS -->
  <div id="tabSettings" hidden>
    <div class="card">
      <h2>⚙️ Website, Donation & Contact Control</h2>
      <label>NGO Name (Header)</label>
      <input type="text" id="sName" placeholder="Rosani Asahaya Seva">
      <label>Tagline</label>
      <input type="text" id="sTagline" placeholder="सेवा • समर्पण • सहायता">
      <label>UPI ID (Donation ke liye)</label>
      <input type="text" id="sUpi" placeholder="example@upi">
      <label>QR Code Image URL (Optional)</label>
      <input type="text" id="sQr" placeholder="qr.png ya image link">
      <label>Donation Message</label>
      <input type="text" id="sDonateNote" placeholder="UPI से पेमेंट करने के बाद स्क्रीनशॉट भेजें।">
      <label>Phone / WhatsApp Number</label>
      <input type="text" id="sPhone" placeholder="+91 9876543210">
      <label>Email</label>
      <input type="email" id="sEmail" placeholder="contact@ngo.org">
      <label>Instagram Handle</label>
      <input type="text" id="sIg" placeholder="@rosaniasahayaseva">
      <label>Address</label>
      <input type="text" id="sAddr" placeholder="All Bihar">
      <button class="btn btn-primary" onclick="saveSettings()">✅ Update Website Settings</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, setDoc, getDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD8q2-R6s9qLzrh1SSm-MkL-gAXD1EHh6A",
  authDomain: "rosani-asahaya-seva.firebaseapp.com",
  projectId: "rosani-asahaya-seva",
  storageBucket: "rosani-asahaya-seva.firebasestorage.app",
  messagingSenderId: "256587001716",
  appId: "1:256587001716:web:922663300412f781034621",
  measurementId: "G-T01JDQ8370"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let allRecords = [];

document.getElementById('fTarikh').value = new Date().toISOString().split('T')[0];

onAuthStateChanged(auth, (user) => {
  document.getElementById('loginView').hidden = !!user;
  document.getElementById('adminView').hidden = !user;
  document.getElementById('logoutBtn').hidden = !user;
  if (user) {
    loadSettings();
    onSnapshot(query(collection(db, "beneficiaries"), orderBy("createdAt", "desc")), (snap) => {
      allRecords = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderAdminTable();
    });
  }
});

window.login = async () => {
  try {
    await signInWithEmailAndPassword(auth, document.getElementById('adminEmail').value, document.getElementById('adminPass').value);
  } catch (e) {
    document.getElementById('loginErr').textContent = "Login failed: " + e.message;
  }
};

window.logout = () => signOut(auth);

window.switchTab = (tab, btn) => {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tabBeneficiaries').hidden = tab !== 'beneficiaries';
  document.getElementById('tabSettings').hidden = tab !== 'settings';
};

window.saveBeneficiary = async () => {
  const naam = document.getElementById('fNaam').value.trim();
  const seva = document.getElementById('fSeva').value;
  const tarikh = document.getElementById('fTarikh').value;
  const status = document.getElementById('fStatus').value;
  const notes = document.getElementById('fNotes').value.trim();
  const editId = document.getElementById('editId').value;

  if (!naam || !tarikh) return alert("Naam aur Tarikh bharna zaroori hai!");

  if (editId) {
    await updateDoc(doc(db, "beneficiaries", editId), { naam, seva, tarikh, status, notes });
    alert("Record Update ho gaya!");
  } else {
    await addDoc(collection(db, "beneficiaries"), { naam, seva, tarikh, status, notes, createdAt: Date.now() });
    alert("Naya Beneficiary Add ho gaya!");
  }
  resetForm();
};

function renderAdminTable() {
  document.getElementById('adminTableBody').innerHTML = allRecords.map(r => `
    <tr>
      <td><strong>${r.naam}</strong><br><small style="color:var(--muted)">${r.notes || ''}</small></td>
      <td>${r.seva}</td>
      <td>${r.tarikh}</td>
      <td>${r.status === 'complete' ? '✅ Complete' : '⏳ Pending'}</td>
      <td style="display:flex;gap:5px;flex-wrap:wrap;">
        ${r.status === 'pending' ? `<button class="btn btn-sm btn-done" onclick="markDone('${r.id}')">✅ Done</button>` : ''}
        <button class="btn btn-sm btn-edit" onclick="editRecord('${r.id}')">✏️</button>
        <button class="btn btn-sm btn-del" onclick="delRecord('${r.id}')">🗑️</button>
      </td>
    </tr>
  `).join('');
}

window.markDone = async (id) => await updateDoc(doc(db, "beneficiaries", id), { status: 'complete' });
window.delRecord = async (id) => { if (confirm("Kya aap is record ko delete karna chahte hain?")) await deleteDoc(doc(db, "beneficiaries", id)); };

window.editRecord = (id) => {
  const r = allRecords.find(x => x.id === id);
  if (!r) return;
  document.getElementById('editId').value = r.id;
  document.getElementById('fNaam').value = r.naam;
  document.getElementById('fSeva').value = r.seva;
  document.getElementById('fTarikh').value = r.tarikh;
  document.getElementById('fStatus').value = r.status;
  document.getElementById('fNotes').value = r.notes || '';
  document.getElementById('formHeading').textContent = "✏️ Record Edit Karein";
  document.getElementById('saveBtn').textContent = "✅ Update Record";
  document.getElementById('cancelEditBtn').hidden = false;
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

window.resetForm = () => {
  document.getElementById('editId').value = '';
  document.getElementById('fNaam').value = '';
  document.getElementById('fNotes').value = '';
  document.getElementById('fStatus').value = 'pending';
  document.getElementById('formHeading').textContent = "➕ नया Beneficiary जोड़ें";
  document.getElementById('saveBtn').textContent = "💾 Save Record";
  document.getElementById('cancelEditBtn').hidden = true;
};

async function loadSettings() {
  const snap = await getDoc(doc(db, "settings", "site"));
  if (snap.exists()) {
    const s = snap.data();
    document.getElementById('sName').value = s.siteName || 'Rosani Asahaya Seva';
    document.getElementById('sTagline').value = s.siteTagline || 'सेवा • समर्पण • सहायता';
    document.getElementById('sUpi').value = s.upiId || '';
    document.getElementById('sQr').value = s.qrUrl || '';
    document.getElementById('sDonateNote').value = s.donateNote || '';
    document.getElementById('sPhone').value = s.phone || '';
    document.getElementById('sEmail').value = s.email || '';
    document.getElementById('sIg').value = s.instagram || '@rosaniasahayaseva';
    document.getElementById('sAddr').value = s.address || 'All Bihar';
  }
}

window.saveSettings = async () => {
  await setDoc(doc(db, "settings", "site"), {
    siteName: document.getElementById('sName').value.trim(),
    siteTagline: document.getElementById('sTagline').value.trim(),
    upiId: document.getElementById('sUpi').value.trim(),
    qrUrl: document.getElementById('sQr').value.trim(),
    donateNote: document.getElementById('sDonateNote').value.trim(),
    phone: document.getElementById('sPhone').value.trim(),
    email: document.getElementById('sEmail').value.trim(),
    instagram: document.getElementById('sIg').value.trim(),
    address: document.getElementById('sAddr').value.trim()
  }, { merge: true });
  alert("Website Settings Update ho gayi hain!");
};
</script>
</body>
  </html>
